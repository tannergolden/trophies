#
# This repository's own case, in repository mode: the kit eating its own
# cooking. It calls the reusable workflow by LOCAL path, so a change to the
# workflow or the action is exercised by the tree that carries it, the way
# standards' self-checks do, rather than by the last release.
#
# Once a day, on the hour at midnight. Every run recomputes everything, so
# a run GitHub delays or drops loses nothing: the next one catches up.

name: '🏆 Case'

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  trophies:
    if: ${{ !github.event.repository.is_template }}
    permissions:
      contents: write # the SVGs, the README block and the ledger
      pull-requests: write # only used with commit: pr
    uses: ./.github/workflows/trophies.yml
    with:
      mode: repository
      kit-ref: ${{ github.sha }} # the tree that carries this change, not the last release
    secrets: inherit # zizmor: ignore[secrets-inherit] - first-party callee at a local path.
