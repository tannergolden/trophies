#
# The reusable workflow a consumer calls. Their repository holds a stub that
# names the schedule and nothing else; the checkout, the measurement, the
# render and the commit all happen here, so a fix lands once and reaches
# every case pinned to @v1.
#
# Called, never copied: nothing with behavior in it is pasted into the
# consumer's tree.

name: '🏆 Trophies'

on:
  workflow_call:
    inputs:
      mode:
        description: 'profile or repository. Empty reads .github/trophies.yml.'
        type: string
        default: ''
      subject:
        description: 'A login (profile) or owner/name (repository). Empty means this repository, or its owner.'
        type: string
        default: ''
      style:
        description: 'trophy, crest, medallion, crystal or plaque. Empty reads the config.'
        type: string
        default: ''
      commit:
        description: 'push (default) commits to the current branch; pr opens or updates one pull request.'
        type: string
        default: 'push'
      commit-branch:
        description: 'The fixed branch the pull request rides on when commit is pr.'
        type: string
        default: 'chore/trophies'
      kit-ref:
        description: >-
          The tannergolden/trophies ref to run: the v1 tag by default. This
          repository's own case passes its commit, so a change is exercised by
          the tree that carries it.
        type: string
        default: 'v1'
      author:
        description: >-
          Who the refresh commit is authored by, as "Name <email>". The
          kit's author by default: every trophy on the page is that
          person's work, and the commit is signed for by the bot as
          committer. The kit recognises its own commits by their scope and
          never counts them toward anyone's trophies, so the name is safe.
        type: string
        default: 'Tanner Golden <24684994+tannergolden@users.noreply.github.com>'
      check:
        description: >-
          true only checks: the committed case is redrawn from the
          measurement the ledger remembers and the run fails if any card or
          the README block differs. Nothing is measured, written or
          committed, and no token is used. For pull-request CI on a
          repository case.
        type: boolean
        default: false
    secrets:
      TROPHIES_TOKEN:
        description: 'Optional read-only personal token: counts private contributions in profile mode.'
        required: false
    outputs:
      changed:
        description: "'true' when the run committed something."
        value: ${{ jobs.trophies.outputs.changed }}
      summary:
        description: 'One line about the case.'
        value: ${{ jobs.trophies.outputs.summary }}

permissions: {}

jobs:
  trophies:
    name: '🏆 Measure and render'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the SVGs, the README block and the ledger
      pull-requests: write # only used when commit is pr
    outputs:
      changed: ${{ steps.kit.outputs.changed }}
      summary: ${{ steps.kit.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The bot commits as itself and the ledger's weekly snapshot must
          # land, so the checkout keeps credentials for the push below.
          persist-credentials: true # zizmor: ignore[artipacked] - the push step below needs them, and nothing else runs after it.

      # A reusable workflow runs against the CALLER's checkout, so the kit is
      # fetched beside it and run by local path. The folder is kept out of
      # the commit below; nothing of it reaches the consumer's tree.
      - name: Fetch the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tannergolden/trophies
          ref: ${{ inputs.kit-ref }}
          path: .trophies-kit
          persist-credentials: false

      - id: kit
        uses: ./.trophies-kit
        with:
          mode: ${{ inputs.check && 'check' || 'run' }}
          case-mode: ${{ inputs.mode }}
          subject: ${{ inputs.subject }}
          style: ${{ inputs.style }}
          token: ${{ secrets.TROPHIES_TOKEN || github.token }}

      # The commit is authored by the kit's author and committed by the bot,
      # so the page shows who made the trophies and the log shows what
      # pushed them. The kit sets its own commits aside when it measures,
      # by their chore(trophies) scope, so the author earns nothing for
      # them. The message is the one the kit wrote for this run: a
      # Conventional Commit per tannergolden/standards, with a scope, a
      # body that says why, and the measured values that make it unique.
      - name: Commit and push
        if: ${{ steps.kit.outputs.changed == 'true' && inputs.commit != 'pr' }}
        shell: bash
        env:
          MESSAGE_FILE: ${{ steps.kit.outputs.commit-file }}
          AUTHOR: ${{ inputs.author }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .trophies-kit
          git add -A
          git commit --author="$AUTHOR" -F "$MESSAGE_FILE"
          # Another kit may have pushed since this run began: the umbrella in
          # tannergolden/markdown runs the kits in turn, and each writes only
          # its own files and its own README markers. The refresh is replayed
          # onto whatever the branch holds now, and pushed from there.
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Drop the kit before the pull request is cut
        id: author
        if: ${{ steps.kit.outputs.changed == 'true' && inputs.commit == 'pr' }}
        shell: bash
        env:
          AUTHOR: ${{ inputs.author }}
        run: |
          set -euo pipefail
          rm -rf .trophies-kit
          # "Name <email>" split for git's author variables
          name="${AUTHOR%%<*}"
          email="${AUTHOR#*<}"
          {
            echo "name=${name% }"
            echo "email=${email%>}"
          } >> "$GITHUB_OUTPUT"

      # open-pr commits with git, so the author variables reach it and name
      # the same author as the push above; the committer stays its own.
      - name: Open or update the pull request
        if: ${{ steps.kit.outputs.changed == 'true' && inputs.commit == 'pr' }}
        uses: tannergolden/standards/actions/open-pr@v1 # zizmor: ignore[unpinned-uses] - first-party action on its moving major, the way every stub calls standards.
        env:
          GIT_AUTHOR_NAME: ${{ steps.author.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.author.outputs.email }}
        with:
          token: ${{ github.token }}
          branch: ${{ inputs.commit-branch }}
          commit-title: ${{ steps.kit.outputs.commit-title }}
          commit-body: ${{ steps.kit.outputs.commit-body }}
