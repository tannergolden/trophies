#
# The reusable workflow a consumer calls. Their repository holds a stub that
# names the schedule and nothing else; the checkout, the measurement, the
# render and the commit all happen here, so a fix lands once and reaches
# every case pinned to @v1.
#
# Called, never copied: nothing with behavior in it is pasted into the
# consumer's tree.

name: '🏆 Trophies'

on:
  workflow_call:
    inputs:
      mode:
        description: 'profile or repository. Empty reads .github/trophies.yml.'
        type: string
        default: ''
      subject:
        description: 'A login (profile) or owner/name (repository). Empty means this repository, or its owner.'
        type: string
        default: ''
      style:
        description: 'trophy, crest, medallion, crystal or plaque. Empty reads the config.'
        type: string
        default: ''
      commit:
        description: 'push (default) commits to the current branch; pr opens or updates one pull request.'
        type: string
        default: 'push'
      commit-branch:
        description: 'The fixed branch the pull request rides on when commit is pr.'
        type: string
        default: 'chore/trophies'
      kit-ref:
        description: >-
          The tannergolden/trophies ref to run: the v1 tag by default. This
          repository's own case passes its commit, so a change is exercised by
          the tree that carries it.
        type: string
        default: 'v1'
    secrets:
      TROPHIES_TOKEN:
        description: 'Optional read-only personal token: counts private contributions in profile mode.'
        required: false
    outputs:
      changed:
        description: "'true' when the run committed something."
        value: ${{ jobs.trophies.outputs.changed }}
      summary:
        description: 'One line about the case.'
        value: ${{ jobs.trophies.outputs.summary }}

permissions: {}

jobs:
  trophies:
    name: '🏆 Measure and render'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the SVGs, the README block and the ledger
      pull-requests: write # only used when commit is pr
    outputs:
      changed: ${{ steps.kit.outputs.changed }}
      summary: ${{ steps.kit.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The bot commits as itself and the ledger's weekly snapshot must
          # land, so the checkout keeps credentials for the push below.
          persist-credentials: true # zizmor: ignore[artipacked] - the push step below needs them, and nothing else runs after it.

      # A reusable workflow runs against the CALLER's checkout, so the kit is
      # fetched beside it and run by local path. The folder is kept out of
      # the commit below; nothing of it reaches the consumer's tree.
      - name: Fetch the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tannergolden/trophies
          ref: ${{ inputs.kit-ref }}
          path: .trophies-kit
          persist-credentials: false

      - id: kit
        uses: ./.trophies-kit
        with:
          mode: run
          case-mode: ${{ inputs.mode }}
          subject: ${{ inputs.subject }}
          style: ${{ inputs.style }}
          token: ${{ secrets.TROPHIES_TOKEN || github.token }}

      # Commits come from the bot, never from the person: a commit authored
      # by the subject would count toward their own Commits and Streak
      # trophies every day. The message is the one the kit wrote for this
      # run: a Conventional Commit per tannergolden/standards, with a scope,
      # a body that says why, and the measured values that make it unique.
      - name: Commit and push
        if: ${{ steps.kit.outputs.changed == 'true' && inputs.commit != 'pr' }}
        shell: bash
        env:
          MESSAGE_FILE: ${{ steps.kit.outputs.commit-file }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .trophies-kit
          git add -A
          git commit -F "$MESSAGE_FILE"
          git push

      - name: Drop the kit before the pull request is cut
        if: ${{ steps.kit.outputs.changed == 'true' && inputs.commit == 'pr' }}
        shell: bash
        run: rm -rf .trophies-kit

      - name: Open or update the pull request
        if: ${{ steps.kit.outputs.changed == 'true' && inputs.commit == 'pr' }}
        uses: tannergolden/standards/actions/open-pr@v1 # zizmor: ignore[unpinned-uses] - first-party action on its moving major, the way every stub calls standards.
        with:
          token: ${{ github.token }}
          branch: ${{ inputs.commit-branch }}
          commit-title: ${{ steps.kit.outputs.commit-title }}
          commit-body: ${{ steps.kit.outputs.commit-body }}
