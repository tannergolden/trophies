# The badges this README draws for itself, rendered by tannergolden/emblems
# into assets/badges/. Edit this file and push: the 🏷️ Badges workflow
# re-renders what changed and commits it. Locally, `make badges` with the
# emblems kit checked out at .emblems/.
#
# Every badge here is STATIC (black label, any message color) and wears
# `for-the-badge`, which is what the documentation standard specifies for a
# header. The four identity badges keep their conventional colors: Status is
# green, Role is pink, Context is purple, License is yellow. Static badges
# link by relative path, so they work in any clone.
#
# Fields: name (kebab-case, the filename), label, message, label_color,
# message_color (palette token or #RRGGBB), icon (registry key), style, link.

badges:
  # --- Identity: the header's conventional four --------------------------------
  - name: status
    label: Status
    message: Active
    label_color: black
    message_color: green
    icon: pulse
    link: ./
  - name: role
    label: Role
    message: Workflow
    label_color: black
    message_color: pink
    icon: play
    link: ./
  - name: context
    label: Context
    message: Trophies
    label_color: black
    message_color: purple
    icon: trophy
    link: ./
  - name: license
    label: License
    message: MIT
    label_color: black
    message_color: yellow
    icon: scale
    link: ./LICENSE

  # --- Facts: what a reader wants to know before the first paragraph -----------
  - name: achievements
    label: Achievements
    message: 100 per mode
    label_color: black
    message_color: amber
    icon: medal
    link: ./docs/Catalogue.md
  - name: styles
    label: Styles
    message: '5'
    label_color: black
    message_color: violet
    icon: sparkle
    link: ./#five-styles
  - name: uptime
    label: Uptime
    message: 24/7/365
    label_color: black
    message_color: emerald
    icon: clock
    link: ./#-what-this-is
  - name: dependencies
    label: Dependencies
    message: None
    label_color: black
    message_color: teal
    icon: package
    link: ./
  - name: use-workflow
    label: ''
    message: Use this workflow
    label_color: black
    message_color: azure
    icon: rocket
    link: ./#-use-it-on-your-profile
