# Put this at .github/workflows/trophies.yml in any repository, and that
# repository's README gets a case of its own: stars, forks, contributors,
# commits, releases, merged pull requests, issues resolved, active days,
# and a hundred achievements.
#
# GITHUB_TOKEN already reads everything about its own repository, private
# or not, so no extra token is needed here.
#
# Using the banners or the badges too? Use tannergolden/markdown's stub
# instead of this one: a single workflow that runs any mix of the kits,
# each at its own hour, so the repository never needs a stub per kit. Not
# both: a kit named there that also has its own stub runs twice.
name: Trophies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  trophies:
    permissions:
      contents: write
      pull-requests: write
    uses: tannergolden/trophies/.github/workflows/trophies.yml@v1
    with:
      mode: repository
      commit: pr # or push, the default, to commit straight to the branch
